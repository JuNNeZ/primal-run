name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python PRIMAL_RUN_Prototype_Kit/tools/validate_kit.py
      - run: python validate_sprites.py
      - run: npm test
      - run: python GDevelop/tools/build_project.py
      - run: npm run test:gdevelop
      - run: python GDevelop/tools/prepare_engine.py
      - run: node GDevelop/tools/export_gdevelop.cjs .cache/gdevelop-5.6.283
      - run: npm run test:gdevelop-runtime
      - run: npm run package:gdevelop
      - uses: actions/upload-artifact@v4
        with:
          name: PRIMAL_RUN_GDevelop
          path: PRIMAL_RUN_GDevelop_2026-10-06.zip
