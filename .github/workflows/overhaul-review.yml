name: Overhaul review (tests + screenshots)
# Runs on pushes to claude/** and codex/** branches. Test output and screenshots are pushed to the
# branch "ci-results/<branch>" so they can be reviewed without opening Actions logs.
on:
  push:
    branches: ['claude/**', 'codex/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit and browser tests (captured)
        timeout-minutes: 25
        run: |
          mkdir -p review
          node --test tests/*.test.cjs > review/unit.txt 2>&1 || echo "UNIT FAILED" >> review/summary.txt
          for f in tests/*-browser.cjs; do
            name=$(basename "$f" .cjs)
            if timeout 240 node "$f" > "review/$name.txt" 2>&1; then echo "ok $name" >> review/summary.txt; else echo "FAIL $name" >> review/summary.txt; fi
          done
          for f in check_kit_directions.cjs check_kit_progression.cjs check_kit_files.cjs; do
            if timeout 240 node "$f" > "review/$(basename $f .cjs).txt" 2>&1; then echo "ok $f" >> review/summary.txt; else echo "FAIL $f" >> review/summary.txt; fi
          done
          for v in tools/validate_game_sprites.py tools/validate_enemy_animations.py; do
            python "$v" > "review/$(basename $v .py).txt" 2>&1 && echo "ok $v" >> review/summary.txt || echo "FAIL $v" >> review/summary.txt
          done
          grep -E "^# (pass|fail)" review/unit.txt >> review/summary.txt || true
      - name: Screenshots
        timeout-minutes: 8
        run: timeout 420 node tools/screenshots.cjs review/shots || echo "SCREENSHOTS FAILED" >> review/summary.txt
      - name: Translation coverage
        timeout-minutes: 8
        run: |
          for l in en; do timeout 400 node tools/i18n_collect.cjs review/i18n-missing-$l.json $l || echo "I18N $l FAILED" >> review/summary.txt; done
      - name: Publish results branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="ci-results/${GITHUB_REF_NAME}"
          cd review
          echo "commit ${GITHUB_SHA}" > COMMIT.txt
          git init -q && git checkout -q -b results
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Review for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
