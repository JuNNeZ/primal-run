<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adfærd — native review</title><style>body{font:16px system-ui;background:#18201c;color:#e1eadc;margin:24px}canvas{image-rendering:pixelated;width:432px;height:432px;background:#e8ece1}select,button{font:inherit;margin:8px;padding:8px}</style><h1>Adfærd — original og nye poses</h1><p>Græsning/snusen, drikning, hvile og kløen. Afviste par beholder originale sprites i spillet. Alle nye poses er prototyper.</p><select id="species"></select><select id="direction"><option>S</option><option>N</option><option>E</option><option>W</option></select><select id="state"><option>graze</option><option>drink</option><option>sleep</option><option>scratch</option></select><button id="pause">Pause</button><button id="background">Lys/mørk</button><p id="status"></p><canvas id="view" width="144" height="144"></canvas><script>
(async()=>{const m=await(await fetch('native_behavior_manifest.json')).json(),s=document.querySelector('#species'),d=document.querySelector('#direction'),a=document.querySelector('#state'),ctx=document.querySelector('canvas').getContext('2d'),ims=new Map();let pause=false,t=0,last=performance.now();[...new Set(m.map(e=>e.species))].forEach(v=>s.add(new Option(v,v)));document.querySelector('#pause').onclick=()=>pause=!pause;let dark=false;document.querySelector('#background').onclick=()=>{dark=!dark;ctx.canvas.style.background=dark?'#151b19':'#e8ece1'};function tick(now){if(!pause)t+=Math.max(0,Math.min(.1,(now-last)/1000));last=now;const rows=m.filter(e=>e.species===s.value&&e.direction===d.value&&(e.activity||e.state)===a.value),e=rows[Math.floor(t*1.5)%2];ctx.clearRect(0,0,144,144);if(e){document.querySelector('#status').textContent=e.runtime_enabled===false?'Original fallback — nyt par afvist':'Aktiv prototype';if(!ims.has(e.file)){const im=new Image;im.src=e.file;ims.set(e.file,im)}const im=ims.get(e.file);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0)}requestAnimationFrame(tick)}requestAnimationFrame(tick)})()
</script></html>
