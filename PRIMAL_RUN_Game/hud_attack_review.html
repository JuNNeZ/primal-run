<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD og artsangreb — prototyper</title><style>body{background:#151b19;color:#e8ece1;font:16px system-ui;max-width:1100px;margin:auto;padding:20px}select,button{padding:8px;margin:6px}canvas,img{image-rendering:pixelated}canvas{width:432px;height:432px;border:1px solid #929387}#light{background:#e8ece1}#dark{background:#151b19}figure{display:inline-block;margin:4px}figcaption{font-size:12px}p{max-width:80ch}</style><h1>HUD og artsangreb</h1><p>Rå genererede prototyper: native pixels og tekniske kontroller består; anatomisk og tidsmæssig kvalitet er endnu ikke godkendt. Vælg art, tilstand og retning. Gamle frames er bevaret som fallback. Parasaurolophus-kick kræver ny rettelse.</p><label>Familie<select id="family"><option value="avatar">HUD-hoved</option><option value="attack">Artsangreb</option></select></label><label>Art<select id="species"></select></label><label>Tilstand<select id="state"></select></label><label>Retning<select id="direction"></select></label><button id="pause">Pause</button><div><canvas id="dark"></canvas><canvas id="light"></canvas></div><p id="info"></p><div id="frames"></div><script type="module">
const heads=await(await fetch('avatar_manifest.json')).json(),atk=(await(await fetch('species_attack_animations.json')).json()).animations,images=new Map();let selected=[],start=performance.now(),paused=false,pauseAt=0;
const $=id=>document.getElementById(id),fill=(el,values)=>{const value=el.value;el.innerHTML=values.map(v=>`<option>${v}</option>`).join('');if(values.includes(value))el.value=value;};
async function choose(reset=false){const head=$('family').value==='avatar',data=head?heads:atk;if(reset)fill($('species'),[...new Set(data.map(x=>x.species))]);const species=$('species').value;fill($('state'),head?['idle','eat','fight','hurt','sneak']:['attack']);fill($('direction'),head?['HUD']:['S','N','E','W']);selected=head?heads.filter(x=>x.species===species&&x.state===$('state').value).sort((a,b)=>a.frame-b.frame).map(x=>x.file):atk.find(x=>x.species===species&&x.direction===$('direction').value).frames;for(const f of selected)if(!images.has(f)){const im=new Image();im.src=f;await im.decode();images.set(f,im);}for(const id of ['dark','light'])$(id).width=$(id).height=head?64:144;$('frames').innerHTML=selected.map((f,i)=>`<figure><img src="${f}" width="${head?128:144}" alt="${species} ${i}"><figcaption>${i} · ${f.split('/').pop()}</figcaption></figure>`).join('');$('info').textContent=head?'64 ×64 · 4 hovedposes · 4 fps':'144 ×144 · 6 angrebsposes · kontakt i frame3';start=performance.now();}
$('family').onchange=()=>choose(true);for(const id of ['species','state','direction'])$(id).onchange=()=>choose();$('pause').onclick=()=>{if(paused)start+=performance.now()-pauseAt;else pauseAt=performance.now();paused=!paused;$('pause').textContent=paused?'Afspil':'Pause';};await choose(true);function draw(now){const n=selected.length;if(n){const head=$('family').value==='avatar',time=((paused?pauseAt:now)-start)/1000,f=head?Math.floor(time*4)%n:Math.min(n-1,Math.floor((time%1.8)*10));for(const id of ['dark','light']){const c=$(id),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(images.get(selected[f]),0,0);}}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
